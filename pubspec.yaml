name: gussoni_crm
description: "CRM gestionale per Gussoni Consulting."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  firebase_analytics: ^12.2.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.2
  desktop_drop: ^0.7.0
  flutter_local_notifications: ^17.2.4
  flutter_native_timezone_latest: ^1.0.0
  timezone: ^0.9.4
  firebase_messaging: ^16.0.3
  firebase_storage: ^13.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/nexora_wordmark_default.png

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: false
  ios: false
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#F7F7F7"
    theme_color: "#00332A"
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
